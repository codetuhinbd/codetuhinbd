<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">CodeTuhin — Engineering Beyond Boundaries.</title>
  <desc id="desc">Profile banner for CodeTuhin, web developer from Bangladesh.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1120"/>
      <stop offset="0.55" stop-color="#0D1528"/>
      <stop offset="1" stop-color="#111A33"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.5" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0 H0 V48" fill="none" stroke="#38BDF8" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#grid)"/>
  <g stroke="#38BDF8" stroke-opacity="0.28" stroke-width="1.2">
    <line x1="880" y1="70" x2="990" y2="130"/>
    <line x1="990" y1="130" x2="1085" y2="80"/>
    <line x1="990" y1="130" x2="1050" y2="215"/>
    <line x1="1050" y1="215" x2="1140" y2="160"/>
    <line x1="1085" y1="80" x2="1140" y2="160"/>
    <line x1="880" y1="70" x2="950" y2="235"/>
    <line x1="950" y1="235" x2="1050" y2="215"/>
    <line x1="880" y1="70" x2="990" y2="130"/>
  </g>
  <g fill="#22D3EE">
    <circle cx="880" cy="70" r="4" fill-opacity="0.9"/>
    <circle cx="990" cy="130" r="5" fill-opacity="0.9"/>
    <circle cx="1050" cy="215" r="4" fill-opacity="0.8"/>
    <circle cx="950" cy="235" r="3.5" fill-opacity="0.7"/>
  </g>
  <g fill="#8B5CF6">
    <circle cx="1085" cy="80" r="4" fill-opacity="0.85"/>
    <circle cx="1140" cy="160" r="5" fill-opacity="0.85"/>
  </g>
  <rect x="72" y="64" width="76" height="76" rx="16" fill="none" stroke="url(#accent)" stroke-width="2.5"/>
  <text x="110" y="118" text-anchor="middle" font-family="'Fira Code', 'Cascadia Code', Consolas, monospace" font-size="34" font-weight="700" fill="#38BDF8">&lt;/&gt;</text>
  <text x="176" y="118" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="64" font-weight="700" letter-spacing="0.5">
    <tspan fill="#F8FAFC">Code</tspan><tspan fill="#38BDF8">Tuhin</tspan>
  </text>
  <text x="178" y="168" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="27" font-weight="500" fill="#CBD5E1">Engineering Beyond Boundaries.</text>
  <text x="178" y="212" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" letter-spacing="4" fill="#8B5CF6">DESIGN. DEVELOP. INNOVATE. DELIVER.</text>
  <text x="178" y="258" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#94A3B8">Full-Stack Web Developer &#183; PHP &#38; MySQL &#183; Bangladesh</text>
  <rect x="0" y="314" width="1200" height="6" fill="url(#accent)"/>
</svg>
